name: Arcade

on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/arcade.yml
      - scripts/arcade.py

permissions:
  contents: write

concurrency: arcade

jobs:
  arcade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw the contribution arcade
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/arcade.py --login "${{ github.repository_owner }}" --out arcade/arcade.svg
      - name: Commit the arcade if it changed
        run: |
          git add arcade/arcade.svg
          if git diff --cached --quiet; then
            echo "The arcade is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "arcade: redraw the contribution arcade"
          git pull --rebase --quiet
          git push --quiet
